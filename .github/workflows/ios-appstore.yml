# Compila el cliente iOS de AOForever en un runner macOS de GitHub y lo SUBE a App Store
# Connect (app 6799763888, bundle com.aoforever.cc). Reusa el certificado Apple Distribution
# guardado como artifact (Apple limita cuantos se pueden crear). Se dispara al pushear la
# rama ios-paquete o a mano desde Actions.
name: iOS - compilar y subir a App Store Connect

on:
  push:
    branches: [ios-paquete]
  workflow_dispatch:
    inputs:
      solo_enviar:
        description: "Solo ENVIAR A REVISION un build ya subido (no compila)"
        type: boolean
        default: false
      build_numero:
        description: "CFBundleVersion del build a enviar (ej. 26.0902.1158); solo con solo_enviar"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  ASC_KEY_ID: 3F53QY9MCN
  ASC_ISSUER_ID: 6cbdae36-3638-4704-b22e-efea6a42b4b2

jobs:
  compilar-subir:
    # Con solo_enviar no se compila nada: va directo al job enviar-revision.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.solo_enviar) }}
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      build_numero: ${{ steps.subir.outputs.build_numero }}
      version_efectiva: ${{ steps.subir.outputs.version_efectiva }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-paquete

      - name: Elegir Xcode 26 (Apple exige SDK de iOS 26 para subir)
        run: |
          ACTUAL=$(xcodebuild -version | head -1)
          case "$ACTUAL" in
            *" 26"*|*" 27"*) echo "Ya esta: $ACTUAL";;
            *)
              ULTIMO=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
              if [ -z "$ULTIMO" ]; then
                echo "::error::Este runner no tiene Xcode 26 (hay: $(ls -d /Applications/Xcode*.app | tr '\n' ' '))"
                exit 1
              fi
              sudo xcode-select -s "$ULTIMO"
              ;;
          esac
          xcodebuild -version

      - name: Rearmar el paquete (zip partido en trozos de <100MB)
        run: |
          cat paquete/AOForever-iOS.zip.part-* > "$RUNNER_TEMP/paquete.zip"
          # NUNCA con unzip: el build 26.810.210 salio de 857KB (sin recursos/)
          # porque el zip hecho con Compress-Archive traia separadores '\' y el
          # unzip de macOS no materializo el arbol. El zipfile de Python normaliza
          # los '\' a '/' al leer, asi que extrae bien CUALQUIERA de los dos zips.
          python3 -m zipfile -e "$RUNNER_TEMP/paquete.zip" "$HOME/aof_ios"
          test -f "$HOME/aof_ios/App/www/index.html" || { echo "::error::El juego no viajo adentro del zip (falta App/www/index.html)"; exit 1; }
          # El juego son ~3500 archivos en App/www (recursos/graficos, sonidos...).
          # Si el conteo baja, el IPA saldria "vacio" otra vez: frenar ACA.
          CANT=$(find "$HOME/aof_ios/App/www" -type f | wc -l | tr -d ' ')
          echo "Archivos en App/www: $CANT"
          if [ "$CANT" -lt 6000 ]; then
            echo "::error::App/www quedo incompleto tras extraer ($CANT archivos; se esperan ~6400). Zip roto o extraccion fallida."
            exit 1
          fi
          test -f "$HOME/aof_ios/App/www/recursos/ui/conectar_clasico_base.png" || { echo "::error::Falta el arte (recursos/ui) tras extraer."; exit 1; }

      - name: Recuperar certificados ya creados (Apple limita los Apple Distribution - NO crear otro)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTS_B64: ${{ secrets.CERTS_B64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/certs_in"
          cd "$GITHUB_WORKSPACE"
          # El certificado Apple Distribution es del EQUIPO (sirve para AOForever y Arduz). Se busca
          # en las corridas exitosas de los workflows que lo guardan como artifact, en este orden.
          for par in "ios-appstore.yml cert-distribution" "macos-appstore.yml certificados-mac" "macos-arduz.yml certificados-mac-arduz"; do
            set -- $par
            [ -n "$(ls -A certs_in 2>/dev/null)" ] && break
            ULT=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$ULT" ] && [ "$ULT" != "null" ]; then
              gh run download "$ULT" -R "$GITHUB_REPOSITORY" -n "$2" -D certs_in 2>/dev/null && echo "Certificados: $2 de la corrida $ULT ($1)" || true
            fi
          done
          # Repo nuevo (sin corridas previas): los certificados vienen del secret CERTS_B64 (tar.gz en
          # base64 de los .p12/.cer/.certSigningRequest que guardo la ultima corrida buena del repo viejo).
          if [ -z "$(ls -A certs_in 2>/dev/null)" ] && [ -n "$CERTS_B64" ]; then
            printf '%s' "$CERTS_B64" | base64 -d | tar -xz -C certs_in && echo "Certificados: del secret CERTS_B64"
          fi
          [ -n "$(ls -A certs_in 2>/dev/null)" ] || echo "Sin certificados previos: fastlane intentara crear uno (puede chocar con el limite de Apple)"
          ls -la certs_in || true

      - name: Instalar la clave API de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Falta el secret ASC_KEY_P8 (contenido del AuthKey_3F53QY9MCN.p8)."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Compilar, firmar y subir (fastlane)
        id: subir
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          # Zips viejos traian el bundle ID cc.aoforever.juego; la app en ASC es com.aoforever.cc.
          sed -i '' 's/cc\.aoforever\.juego/com.aoforever.cc/g' "$HOME/aof_ios/AOForever.xcodeproj/project.pbxproj"
          # Numero de build UNICO y creciente (Apple rechaza reusar el mismo).
          NUEVO="26.$(date -u +%m%d).$(date -u +%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NUEVO" "$HOME/aof_ios/App/Info.plist"
          echo "CFBundleVersion -> $NUEVO"
          mkdir -p "$HOME/aof_ios/fastlane"
          cp "$GITHUB_WORKSPACE/fastlane/Fastfile" "$HOME/aof_ios/fastlane/Fastfile"
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          export CERTS_IN="$GITHUB_WORKSPACE/certs_in"
          cd "$HOME/aof_ios"
          # Version de marketing EFECTIVA: la de variables.txt, o la siguiente si Apple ya
          # cerro ese train (version publicada). Se pisa en Info.plist y en el pbxproj.
          export VERSION_MKT="$(grep -E '^VERSION_MARKETING=' "$GITHUB_WORKSPACE/variables.txt" 2>/dev/null | head -1 | cut -d= -f2- | tr -d ' \r')"
          fastlane version_efectiva
          VEF="$(tr -d ' \r\n' < "$HOME/version_efectiva.txt")"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VEF" App/Info.plist
          sed -i '' -E "s/MARKETING_VERSION = \"?[0-9.]+\"?;/MARKETING_VERSION = \"$VEF\";/g" AOForever.xcodeproj/project.pbxproj
          printf 'VERSION_EFECTIVA_PLANA=%s\n' "$VEF"
          echo "version_efectiva=$VEF" >> "$GITHUB_OUTPUT"
          fastlane subir
          echo "Listo: el build quedo subido a App Store Connect."
          echo "build_numero=$NUEVO" >> "$GITHUB_OUTPUT"
          # Copia del IPA firmado para dejarlo como artifact de la corrida (descargable con
          # `gh run download <id> -R <repo> -n ipa-<build>`): App Store Connect no permite bajarlo.
          mkdir -p "$GITHUB_WORKSPACE/ipa_out"
          cp -f build/ipa/*.ipa "$GITHUB_WORKSPACE/ipa_out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/ipa_out" || true

      - name: Guardar certificados (reuso futuro)
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/certs_all"
          cp -f "$GITHUB_WORKSPACE"/certs_in/* "$GITHUB_WORKSPACE/certs_all/" 2>/dev/null || true
          cp -f "$HOME"/aof_ios/certs_out/* "$GITHUB_WORKSPACE/certs_all/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-distribution
          path: certs_all/
          if-no-files-found: ignore
          retention-days: 90
      - name: Guardar el IPA compilado (artifact ipa-<build>, 30 dias)
        if: steps.subir.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.subir.outputs.build_numero }}
          path: ipa_out/*.ipa
          if-no-files-found: warn
          retention-days: 30

  # Envia a REVISION el build recien subido (o uno ya subido, con solo_enviar): espera que
  # Apple lo procese, crea la version (VERSION_MARKETING de variables.txt), carga las
  # notas (notas_version.txt), elige el build y hace Submit for Review con release
  # automatico. Asi no queda nada pendiente para clickear en App Store Connect.
  enviar-revision:
    needs: [compilar-subir]
    if: ${{ always() && (needs.compilar-subir.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.solo_enviar)) }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-paquete

      - name: Instalar la clave API de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Falta el secret ASC_KEY_P8"; exit 1; }
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Enviar a revision (version + notas + build + Submit for Review)
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          BUILD_NUMERO_INPUT: ${{ inputs.build_numero }}
          BUILD_NUMERO_JOB: ${{ needs.compilar-subir.outputs.build_numero }}
          VERSION_EFECTIVA_JOB: ${{ needs.compilar-subir.outputs.version_efectiva }}
          PLATAFORMA: ios
        run: |
          NUMERO="${BUILD_NUMERO_INPUT:-$BUILD_NUMERO_JOB}"
          [ -n "$NUMERO" ] || { echo "::error::No se cual build enviar (falta build_numero)"; exit 1; }
          leer() { grep -E "^$1=" "$2" 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^ *//;s/ *$//'; }
          # La version real sale del build subido; esto es solo un respaldo.
          export VERSION_MKT="${VERSION_EFECTIVA_JOB:-$(leer VERSION_MARKETING variables.txt)}"
          export NOTAS_ES="$(leer ES notas_version.txt)"
          export NOTAS_EN="$(leer EN notas_version.txt)"
          [ -n "$NOTAS_ES" ] || { echo "::error::Falta la linea ES= en notas_version.txt de la rama (corre el .bat de nuevo)"; exit 1; }
          echo "Build $NUMERO | version (respaldo) $VERSION_MKT | notas: $NOTAS_ES"
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          export BUILD_NUMERO="$NUMERO"
          mkdir -p enviar/fastlane
          cp fastlane/Fastfile enviar/fastlane/Fastfile
          cd enviar
          fastlane enviar_revision
